<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销量监控系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#282828;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --pink:#ff6b9d;--pink2:#ff4080;
  --pink-bg:rgba(255,107,157,0.1);--pink-border:rgba(255,107,157,0.28);
  --green:#4ade80;--green-bg:rgba(74,222,128,0.1);
  --red:#f87171;--red-bg:rgba(248,113,113,0.1);
  --amber:#fbbf24;--amber-bg:rgba(251,191,36,0.1);
  --blue:#60a5fa;
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Noto Sans SC',system-ui,sans-serif;min-height:100vh;font-size:14px;line-height:1.6;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.lcard{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:40px;width:360px;max-width:95vw;}
.llogo{text-align:center;margin-bottom:28px;}
.llogo .ico{font-size:30px;margin-bottom:8px;}
.llogo h1{font-size:17px;font-weight:600;}
.llogo p{font-size:12px;color:var(--text3);margin-top:3px;}
.fg{margin-bottom:13px;}
.fg label{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;}
.fg input,.fg select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.fg input:focus,.fg select:focus{border-color:var(--pink);}
.fg select option{background:var(--bg3);}
.lbtn{width:100%;padding:11px;background:var(--pink2);border:none;border-radius:var(--rs);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
.lbtn:hover{opacity:.88;}
.lerr{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none;}
#app{display:none;}
.topbar{height:50px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;position:sticky;top:0;z-index:100;}
.brand{font-size:15px;font-weight:700;color:var(--pink);flex:1;}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.sdot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.sdot{animation:pulse 2s infinite;}
.tbadge{background:var(--pink-bg);border:1px solid var(--pink-border);color:var(--pink);font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;}
.tclock{font-size:12px;color:var(--text3);}
.lout{font-size:12px;color:var(--text3);cursor:pointer;padding:4px 8px;border:1px solid var(--border);border-radius:var(--rs);background:transparent;}
.tabs{display:flex;padding:10px 18px 0;background:var(--bg2);border-bottom:1px solid var(--border);}
.tab{padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text3);border-bottom:2px solid transparent;transition:all .2s;}
.tab.on{color:var(--pink);border-bottom-color:var(--pink);}
.pg{display:none;padding:18px;}
.pg.on{display:block;}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;}
.sc .lbl{font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;}
.sc .val{font-size:25px;font-weight:700;line-height:1.2;}
.sc .sub{font-size:10px;color:var(--text3);margin-top:2px;}
.sc.pk .val{color:var(--pink);}
.sc.gn .val{color:var(--green);}
.sc.am .val{color:var(--amber);}
.sc.bl .val{color:var(--blue);}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.st{font-size:13px;font-weight:600;}
.ss{font-size:11px;color:var(--text3);}
.cc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:12px;}
.cc h3{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:11px;text-transform:uppercase;letter-spacing:.4px;}
.tscroll{max-height:430px;overflow-y:auto;}
.tscroll::-webkit-scrollbar{width:3px;}
.tscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.dt{width:100%;border-collapse:collapse;font-size:13px;}
.dt th{text-align:left;padding:8px 11px;font-size:10px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;}
.dt td{padding:8px 11px;border-bottom:1px solid var(--border);color:var(--text2);white-space:nowrap;}
.dt tr:last-child td{border-bottom:none;}
.dt tr:hover td{background:var(--bg3);}
.bk{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.bn{background:var(--green-bg);color:var(--green);border:1px solid rgba(74,222,128,.2);}
.br{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.2);}
.bi{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(251,191,36,.2);}
.qp{color:var(--green);font-weight:600;}
.qr{color:var(--red);font-weight:600;}
.frow{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
.fb{font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text3);}
.fb.on{background:var(--pink-bg);border-color:var(--pink-border);color:var(--pink);}
.hbox{background:var(--pink-bg);border:1px solid var(--pink-border);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;}
.hbox .hl{font-size:10px;color:var(--pink);margin-bottom:5px;font-weight:600;text-transform:uppercase;}
.hbox .hc{font-size:13px;color:var(--text);line-height:1.7;}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-bottom:18px;}
.chc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;}
.chc .cn{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;}
.chc .cv{font-size:21px;font-weight:700;}
.chc .cp{font-size:10px;color:var(--text3);margin-top:2px;}
.chbar{height:3px;background:var(--bg4);border-radius:2px;margin-top:9px;overflow:hidden;}
.chfill{height:100%;border-radius:2px;}
.sgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px;margin-bottom:18px;}
.stk{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:13px;}
.stk .sk-site{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;margin-bottom:4px;}
.stk .sk-val{font-size:20px;font-weight:700;color:var(--text);}
.stk .sk-lbl{font-size:10px;color:var(--text3);margin-top:2px;}
.ebanner{background:var(--red-bg);border:1px solid rgba(248,113,113,.25);border-radius:var(--rs);padding:9px 13px;font-size:12px;color:var(--red);margin:12px 18px 0;display:none;}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:600px){.agrid{grid-template-columns:1fr;}}
.lgnd{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:9px;}
.li{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">
      <div class="ico">&#128202;</div>
      <h1>销量监控系统</h1>
      <p>Sales Monitor · 实时数据看板</p>
    </div>
    <div class="fg">
      <label>账号</label>
      <input type="text" id="iu" placeholder="请输入账号" autocomplete="off"/>
    </div>
    <div class="fg">
      <label>密码</label>
      <input type="password" id="ip" placeholder="请输入密码"/>
    </div>
    <div class="fg">
      <label>团体</label>
      <select id="it">
        <option value="">-- 请选择 --</option>
        <option value="zb1">ZEROBASEONE (ZB1)</option>
        <option value="epex">EPEX</option>
        <option value="custom">其他</option>
      </select>
    </div>
    <button class="lbtn" onclick="doLogin()">进入看板</button>
    <div class="lerr" id="lerr">账号或密码错误</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">&#128202; 销量监控</div>
    <div class="sdot" id="sdot"></div>
    <span class="tclock" id="clk">--:--:--</span>
    <span class="tbadge" id="tbadge">--</span>
    <button class="lout" onclick="doLogout()">退出</button>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="swTab('records',this)">销量记录</button>
    <button class="tab" onclick="swTab('analysis',this)">整体分析</button>
    <button class="tab" onclick="swTab('channels',this)">渠道/库存</button>
  </div>
  <div class="ebanner" id="ebanner">无法读取数据文件，请确认 Python 脚本正在运行</div>

  <div class="pg on" id="tab-records">
    <div class="sgrid">
      <div class="sc pk"><div class="lbl">累计销量</div><div class="val" id="s-total">-</div><div class="sub">自开始监控</div></div>
      <div class="sc gn"><div class="lbl">最新变动</div><div class="val" id="s-latest">-</div><div class="sub">上一笔销量</div></div>
      <div class="sc am"><div class="lbl">回测次数</div><div class="val" id="s-revert">-</div><div class="sub">库存增加/退单</div></div>
      <div class="sc bl"><div class="lbl">记录条数</div><div class="val" id="s-count">-</div><div class="sub">总变动记录</div></div>
    </div>
    <div class="sh">
      <span class="st">变动记录明细</span>
      <span class="ss" id="upd">-</span>
    </div>
    <div class="frow">
      <button class="fb on" onclick="setF('all',this)">全部</button>
      <button class="fb" onclick="setF('normal',this)">正常销售</button>
      <button class="fb" onclick="setF('revert',this)">回测/退单</button>
      <button class="fb" onclick="setF('init',this)">初始化</button>
    </div>
    <div class="tscroll">
      <table class="dt">
        <thead><tr>
          <th>变动时间</th><th>渠道</th><th>变动前</th><th>变动后</th><th>变动数量</th><th>状态</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="pg" id="tab-analysis">
    <div class="hbox">
      <div class="hl">高光数据</div>
      <div class="hc" id="hltxt">-</div>
    </div>
    <div class="agrid">
      <div class="cc">
        <h3>累计销量趋势</h3>
        <div style="position:relative;height:190px;"><canvas id="c-trend"></canvas></div>
      </div>
      <div class="cc">
        <h3>渠道销量分布</h3>
        <div class="lgnd" id="lgnd"></div>
        <div style="position:relative;height:160px;"><canvas id="c-pie"></canvas></div>
      </div>
    </div>
    <div class="cc">
      <h3>每笔销量时间轴（粉=正常 红=回测）</h3>
      <div style="position:relative;height:150px;"><canvas id="c-tl"></canvas></div>
    </div>
  </div>

  <div class="pg" id="tab-channels">
    <div class="sh"><span class="st">各站点当前库存</span><span class="ss">负数=k4超卖状态</span></div>
    <div class="sgrid2" id="stock-grid"></div>
    <div class="sh"><span class="st">渠道销量排行</span></div>
    <div class="chgrid" id="chgrid"></div>
    <div class="cc">
      <h3>渠道销量对比</h3>
      <div style="position:relative;height:200px;"><canvas id="c-chbar"></canvas></div>
    </div>
  </div>
</div>

<script>
var ACCOUNTS = {
  "admin":     {password: "admin888",  team: null},
  "zb1_2025":  {password: "hanbin168", team: "zb1"},
  "epex_2025": {password: "epex168",   team: "epex"}
};

var DATA_FILES = {
  "zb1":    "data_k4.json",
  "epex":   "data_epex.json",
  "custom": "data_custom.json"
};

var TEAM_NAMES = {
  "zb1":    "ZB1 · SUNG HANBIN",
  "epex":   "EPEX",
  "custom": "自定义团体"
};

var COLORS = ["#ff6b9d","#60a5fa","#4ade80","#fbbf24","#a78bfa","#f87171","#fb923c","#34d399"];

var S = {team: null, data: null, filter: "all", charts: {}, timer: null};

function doLogin() {
  var u = document.getElementById("iu").value.trim();
  var p = document.getElementById("ip").value;
  var ts = document.getElementById("it").value;
  var err = document.getElementById("lerr");
  var acc = ACCOUNTS[u];
  if (!acc || acc.password !== p) {
    err.style.display = "block";
    err.textContent = "账号或密码错误";
    return;
  }
  var team = acc.team || ts;
  if (!team) {
    err.style.display = "block";
    err.textContent = "请选择团体";
    return;
  }
  err.style.display = "none";
  S.team = team;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("tbadge").textContent = TEAM_NAMES[team] || team;
  startClock();
  fetchData();
  S.timer = setInterval(fetchData, 5000);
}

function doLogout() {
  clearInterval(S.timer);
  Object.values(S.charts).forEach(function(c) { if (c && c.destroy) c.destroy(); });
  S.charts = {};
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

function fetchData() {
  var file = (DATA_FILES[S.team] || "data_k4.json") + "?_=" + Date.now();
  fetch(file)
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(data) {
      S.data = data;
      document.getElementById("ebanner").style.display = "none";
      document.getElementById("sdot").className = "sdot";
      render();
    })
    .catch(function() {
      document.getElementById("ebanner").style.display = "block";
      document.getElementById("sdot").className = "sdot err";
    });
}

function render() {
  var d = S.data;
  if (!d) return;
  var s = d.summary;
  document.getElementById("s-total").textContent  = s.total_sales;
  document.getElementById("s-latest").textContent = s.latest_qty;
  document.getElementById("s-revert").textContent = s.revert_count;
  document.getElementById("s-count").textContent  = s.record_count;
  document.getElementById("upd").textContent = "更新: " + (d.updated_at || "").slice(0, 19);
  renderTable(d.records || []);
  renderAnalysis(d);
  renderChannels(d);
}

function renderTable(recs) {
  var f = S.filter === "all" ? recs : recs.filter(function(r) { return r.type === S.filter; });
  var html = "";
  for (var i = 0; i < f.length; i++) {
    var r = f[i];
    var badge = r.type === "normal" ? '<span class="bk bn">正常</span>' :
                r.type === "revert" ? '<span class="bk br">回测</span>' :
                '<span class="bk bi">初始</span>';
    var isR = r.type === "revert";
    var qCls = isR ? "qr" : "qp";
    var qStr = isR ? ("+" + r.qty_abs) : ("-" + r.qty_abs);
    var beforeStr = (r.before !== null && r.before !== undefined) ? r.before : "-";
    var afterStr  = (r.after  !== null && r.after  !== undefined) ? r.after  : "-";
    html += "<tr><td style='color:var(--text3);font-size:12px;'>" + r.time + "</td>";
    html += "<td style='color:var(--text);font-weight:500;'>" + r.channel + "</td>";
    html += "<td>" + beforeStr + "</td>";
    html += "<td>" + afterStr + "</td>";
    html += "<td class='" + qCls + "'>" + qStr + "</td>";
    html += "<td>" + badge + "</td></tr>";
  }
  document.getElementById("tbody").innerHTML = html;
}

function setF(f, btn) {
  S.filter = f;
  document.querySelectorAll(".fb").forEach(function(b) { b.classList.remove("on"); });
  btn.classList.add("on");
  if (S.data) renderTable(S.data.records || []);
}

function dc(k) {
  if (S.charts[k]) { S.charts[k].destroy(); S.charts[k] = null; }
}

function renderAnalysis(d) {
  var trend = d.trend || [];
  dc("trend");
  S.charts.trend = new Chart(document.getElementById("c-trend"), {
    type: "line",
    data: {
      labels: trend.map(function(t) { return t.time.slice(11,16); }),
      datasets: [{
        data: trend.map(function(t) { return t.cumulative; }),
        borderColor: "#ff6b9d",
        backgroundColor: "rgba(255,107,157,0.07)",
        tension: 0.4, fill: true, pointRadius: 1
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}},
      scales: {
        x: {ticks: {color: "#555", font: {size: 10}, maxTicksLimit: 8}, grid: {color: "rgba(255,255,255,0.04)"}},
        y: {ticks: {color: "#555", font: {size: 10}}, grid: {color: "rgba(255,255,255,0.04)"}}
      }
    }
  });

  var ch = d.channel_totals || {};
  var chL = Object.keys(ch);
  var chD = Object.values(ch);
  var lgnd = "";
  for (var i = 0; i < chL.length; i++) {
    lgnd += '<span class="li"><span class="ld" style="background:' + COLORS[i % COLORS.length] + '"></span>' + chL[i] + ': ' + chD[i] + '</span>';
  }
  document.getElementById("lgnd").innerHTML = lgnd;
  dc("pie");
  S.charts.pie = new Chart(document.getElementById("c-pie"), {
    type: "doughnut",
    data: {
      labels: chL,
      datasets: [{data: chD, backgroundColor: chL.map(function(_,i) { return COLORS[i % COLORS.length]; }), borderWidth: 0}]
    },
    options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {display: false}}}
  });

  var tl = (d.records || []).filter(function(r) { return r.type !== "init"; }).slice(-60);
  dc("tl");
  S.charts.tl = new Chart(document.getElementById("c-tl"), {
    type: "bar",
    data: {
      labels: tl.map(function(r) { return r.time.slice(11,16); }),
      datasets: [{
        data: tl.map(function(r) { return r.qty_abs; }),
        backgroundColor: tl.map(function(r) { return r.type === "revert" ? "rgba(248,113,113,0.75)" : "rgba(255,107,157,0.6)"; }),
        borderRadius: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}},
      scales: {
        x: {ticks: {color: "#555", font: {size: 10}, maxTicksLimit: 10}, grid: {display: false}},
        y: {ticks: {color: "#555", font: {size: 10}}, grid: {color: "rgba(255,255,255,0.04)"}}
      }
    }
  });

  var total = d.summary.total_sales || 1;
  var topCh = {l: "-", v: 0};
  for (var j = 0; j < chL.length; j++) {
    if (chD[j] >= topCh.v) { topCh = {l: chL[j], v: chD[j]}; }
  }
  var pct = Math.round((topCh.v / total) * 100);
  document.getElementById("hltxt").innerHTML =
    'TOP渠道 <strong style="color:var(--pink)">' + topCh.l + '</strong>' +
    ' 累计 <strong style="color:var(--pink)">' + topCh.v + '</strong> 件（占比 ' + pct + '%）' +
    ' &nbsp;·&nbsp; 总销量 <strong style="color:var(--green)">' + d.summary.total_sales + '</strong>' +
    ' &nbsp;·&nbsp; 回测 <strong style="color:var(--red)">' + d.summary.revert_count + '</strong> 次';
}

function renderChannels(d) {
  var stocks = d.current_stocks || [];
  var shtml = "";
  for (var i = 0; i < stocks.length; i++) {
    var s = stocks[i];
    shtml += '<div class="stk"><div class="sk-site">' + s.site + '</div>';
    shtml += '<div class="sk-val">' + (s.display || s.quantity || "-") + '</div>';
    shtml += '<div class="sk-lbl">当前库存</div></div>';
  }
  document.getElementById("stock-grid").innerHTML = shtml;

  var ch = d.channel_totals || {};
  var entries = Object.entries(ch).sort(function(a,b) { return b[1]-a[1]; });
  var maxV = entries.length ? entries[0][1] : 1;
  var totalCh = entries.reduce(function(s,e) { return s + e[1]; }, 0) || 1;
  var chtml = "";
  for (var j = 0; j < entries.length; j++) {
    var name = entries[j][0], val = entries[j][1];
    var pct = Math.round(val / totalCh * 100);
    var barW = Math.round(val / maxV * 100);
    chtml += '<div class="chc"><div class="cn">' + name + '</div>';
    chtml += '<div class="cv">' + val + '</div>';
    chtml += '<div class="cp">' + pct + '% 占比</div>';
    chtml += '<div class="chbar"><div class="chfill" style="width:' + barW + '%;background:' + COLORS[j % COLORS.length] + '"></div></div></div>';
  }
  document.getElementById("chgrid").innerHTML = chtml;

  dc("chbar");
  S.charts.chbar = new Chart(document.getElementById("c-chbar"), {
    type: "bar",
    data: {
      labels: entries.map(function(e) { return e[0]; }),
      datasets: [{
        data: entries.map(function(e) { return e[1]; }),
        backgroundColor: entries.map(function(_,i) { return COLORS[i % COLORS.length]; }),
        borderRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}},
      scales: {
        x: {ticks: {color: "#999", font: {size: 12}}, grid: {display: false}},
        y: {ticks: {color: "#555", font: {size: 10}}, grid: {color: "rgba(255,255,255,0.04)"}}
      }
    }
  });
}

function swTab(id, btn) {
  document.querySelectorAll(".tab").forEach(function(b) { b.classList.remove("on"); });
  document.querySelectorAll(".pg").forEach(function(p) { p.classList.remove("on"); });
  btn.classList.add("on");
  document.getElementById("tab-" + id).classList.add("on");
}

function startClock() {
  setInterval(function() {
    document.getElementById("clk").textContent = new Date().toLocaleTimeString("zh-CN");
  }, 1000);
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") doLogin();
});
</script>
</body>
